<section id="skills" class="alt" aria-labelledby="skills-h">
  <div class="wrap">
    <div class="sec-head" data-reveal>
      <div><span class="tag">// toolbox</span><h2 id="skills-h">Skills &amp; stack</h2><p>Pick an area, then tap a skill to see where I've used it.</p></div>
    </div>

    <div class="skills-v2" data-reveal>
      <div class="skills-radar-card">
        <svg class="skills-radar" id="skillsRadar" viewBox="-40 0 400 300" role="img" aria-label="Relative strength across skill areas"></svg>
        <div class="level-legend">
          <span><i class="lv lv3"></i>Daily driver</span>
          <span><i class="lv lv2"></i>Shipped in prod</span>
          <span><i class="lv lv1"></i>Familiar</span>
        </div>
      </div>

      <div class="skills-board">
        <div class="filter-pills" id="skillTabs" role="tablist" aria-label="Skill areas"></div>
        <div class="skill-detail" id="skillDetail" aria-live="polite">
          <span class="sd-hint">👇 Tap a skill to see the projects behind it.</span>
        </div>
        <div class="skill-tiles" id="skillTiles" role="tabpanel"></div>
      </div>
    </div>
  </div>
</section>
