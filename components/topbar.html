<div class="topbar">
  <div class="wrap">
    <button class="brand" id="brandHome" type="button">Vignesh J</button>
    <div class="right">
      <nav aria-label="Section navigation" id="mainNav">
        <a href="#projects">work</a>
        <a href="#experience">experience</a>
        <a href="#skills">skills</a>
        <a href="#how">how I build</a>
        <button class="navlink" id="navBlog" type="button">blog</button>
        <a href="#contact">contact</a>
      </nav>
      <div class="theme-picker">
        <button class="icon-btn" id="paletteBtn" type="button" aria-label="Theme options" aria-expanded="false" aria-controls="themePanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.3"/><circle cx="17.5" cy="10.5" r="1.3"/><circle cx="8.5" cy="7.5" r="1.3"/><circle cx="6.5" cy="12.5" r="1.3"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/></svg>
        </button>
        <div class="theme-panel" id="themePanel" role="dialog" aria-label="Theme options" hidden>
          <span class="tp-k">Mode</span>
          <div class="tp-seg" id="modeSeg" role="radiogroup" aria-label="Colour mode">
            <button type="button" role="radio" data-mode="light">☀️ Light</button>
            <button type="button" role="radio" data-mode="dark">🌙 Dark</button>
            <button type="button" role="radio" data-mode="auto">💻 Auto</button>
          </div>
          <span class="tp-k">Accent</span>
          <div class="tp-swatches" id="paletteSwatches" role="radiogroup" aria-label="Accent colour">
            <button type="button" role="radio" data-palette="ocean"><i><b></b></i>Ocean</button>
            <button type="button" role="radio" data-palette="aurora"><i><b></b></i>Aurora</button>
            <button type="button" role="radio" data-palette="sunset"><i><b></b></i>Sunset</button>
            <button type="button" role="radio" data-palette="nebula"><i><b></b></i>Nebula</button>
            <button type="button" role="radio" data-palette="forest"><i><b></b></i>Forest</button>
          </div>
          <label class="tp-switch"><input type="checkbox" id="motionToggle" checked> <span>Animations</span></label>
        </div>
      </div>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light theme">
        <svg class="icon-sun" aria-hidden="true"><use href="icons/icons.svg#sun"></use></svg>
        <svg class="icon-moon" aria-hidden="true"><use href="icons/icons.svg#moon"></use></svg>
      </button>
      <button class="icon-btn hamburger" id="hamburgerBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav">
        <span class="burger" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </div>
  <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation" hidden>
    <a href="#projects">work</a>
    <a href="#experience">experience</a>
    <a href="#skills">skills</a>
    <a href="#how">how I build</a>
    <button class="navlink" id="navBlogMobile" type="button">blog</button>
    <a href="#contact">contact</a>
  </nav>
</div>
