<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vignesh J — Resume</title>
<meta name="description" content="Resume of Vignesh J, Software Engineer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css?v=2">
<link rel="stylesheet" href="resume.css?v=7">
<script>
  /* Same settings as the portfolio: portfolio_theme / portfolio_palette / portfolio_motion */
  (function () {
    var root = document.documentElement;
    try {
      var saved = localStorage.getItem('portfolio_theme');
      root.setAttribute('data-theme', saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      root.setAttribute('data-palette', localStorage.getItem('portfolio_palette') || 'ocean');
      if (localStorage.getItem('portfolio_motion') === 'off') root.setAttribute('data-motion', 'off');
    } catch (e) {
      root.setAttribute('data-theme', 'light');
      root.setAttribute('data-palette', 'ocean');
    }
  })();
</script>
</head>
<body>
<div class="read-progress no-print" id="readProgress" aria-hidden="true"></div>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="../" aria-label="Back to portfolio">Vignesh<span class="blink">_</span></a>
    <div class="right">
      <nav aria-label="Section navigation" id="mainNav">
        <a href="#experience">experience</a>
        <a href="#projects">projects</a>
        <a href="#skills">skills</a>
        <a href="#education">education</a>
      </nav>
      <div class="theme-picker">
        <button class="icon-btn" id="paletteBtn" type="button" aria-label="Theme options" aria-expanded="false" aria-controls="themePanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.3"/><circle cx="17.5" cy="10.5" r="1.3"/><circle cx="8.5" cy="7.5" r="1.3"/><circle cx="6.5" cy="12.5" r="1.3"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/></svg>
        </button>
        <div class="theme-panel" id="themePanel" role="dialog" aria-label="Theme options" hidden>
          <span class="tp-k">Mode</span>
          <div class="tp-seg" id="modeSeg" role="radiogroup" aria-label="Colour mode">
            <button type="button" role="radio" data-mode="light">☀️ Light</button>
            <button type="button" role="radio" data-mode="dark">🌙 Dark</button>
            <button type="button" role="radio" data-mode="auto">💻 Auto</button>
          </div>
          <span class="tp-k">Accent</span>
          <div class="tp-swatches" id="paletteSwatches" role="radiogroup" aria-label="Accent colour">
            <button type="button" role="radio" data-palette="ocean"><i><b></b></i>Ocean</button>
            <button type="button" role="radio" data-palette="aurora"><i><b></b></i>Aurora</button>
            <button type="button" role="radio" data-palette="sunset"><i><b></b></i>Sunset</button>
            <button type="button" role="radio" data-palette="nebula"><i><b></b></i>Nebula</button>
            <button type="button" role="radio" data-palette="forest"><i><b></b></i>Forest</button>
          </div>
          <label class="tp-switch"><input type="checkbox" id="motionToggle" checked> <span>Animations</span></label>
        </div>
      </div>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light theme">
        <svg class="icon-sun" aria-hidden="true"><use href="../icons/icons.svg#sun"></use></svg>
        <svg class="icon-moon" aria-hidden="true"><use href="../icons/icons.svg#moon"></use></svg>
      </button>
      <button class="icon-btn hamburger" id="hamburgerBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav">
        <svg aria-hidden="true"><use href="../icons/icons.svg#menu"></use></svg>
      </button>
    </div>
  </div>
  <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation" hidden>
    <a href="#experience">experience</a>
    <a href="#projects">projects</a>
    <a href="#skills">skills</a>
    <a href="#education">education</a>
  </nav>
</div>

<div class="page-actions no-print">
  <a class="btn" href="../">← Back to portfolio</a>
  <div class="page-actions-right">
    <button class="btn" id="shareBtn" type="button">
      <svg class="btn-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.5 10.5 15.5 6.5"/><path d="M8.5 13.5 15.5 17.5"/></svg>
      <span class="btn-label">Share</span>
    </button>
    <button class="btn primary" id="downloadBtn" type="button">
      <svg class="btn-icon" aria-hidden="true"><use href="../icons/icons.svg#download"></use></svg>
      <span class="btn-label">Download / Print</span>
    </button>
  </div>
</div>

<!-- Interactive toolbar (hidden when printing) -->
<div class="rz-toolbar no-print" id="rzToolbar">
  <div class="rz-search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="rzSearch" placeholder="Search my resume (Laravel, MCP…)" aria-label="Search the resume" autocomplete="off">
    <kbd aria-hidden="true">/</kbd>
  </div>
  <div class="rz-quick" role="group" aria-label="Quick filters">
    <span class="rz-k">Try:</span>
    <button type="button" class="rz-chip" data-q="AI">🤖 AI</button>
    <button type="button" class="rz-chip" data-q="MCP">MCP</button>
    <button type="button" class="rz-chip" data-q="Redis">Redis</button>
    <button type="button" class="rz-chip" data-q="Pest">Pest</button>
    <button type="button" class="rz-chip" data-q="Laravel">Laravel</button>
    <button type="button" class="rz-chip" data-q="voice">Voice</button>
  </div>
  <div class="rz-modes">
    <label class="rz-toggle"><input type="checkbox" id="rzMetrics" checked><span>Highlight impact</span></label>
    <label class="rz-toggle"><input type="checkbox" id="rzScan"><span>Quick scan</span></label>
  </div>
  <div class="rz-status" id="rzStatus" aria-live="polite"></div>
</div>

<main class="resume-page" id="resumePage">
  <div class="loading" id="loading">Loading resume…</div>
</main>

<div class="rz-toast no-print" id="rzToast" role="status" aria-live="polite"></div>

<script src="../js/theme.js?v=1"></script>
<script src="resume-fx.js?v=2"></script>
<script src="resume.js?v=6"></script>
<script>
  (function(){
    var themeBtn = document.getElementById('themeToggle');
    var hamburger = document.getElementById('hamburgerBtn');
    var mobileNav = document.getElementById('mobileNav');
    var root = document.documentElement;

    function label(){
      var t = root.getAttribute('data-theme');
      themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    }
    label();

    themeBtn.addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('portfolio_theme', next); } catch (e) {}
      label();
    });

    function closeMobileNav(){
      mobileNav.classList.remove('open');
      mobileNav.hidden = true;
      hamburger.setAttribute('aria-expanded','false');
    }
    if(hamburger){
      hamburger.addEventListener('click', function(){
        var isOpen = mobileNav.classList.contains('open');
        if(isOpen){ closeMobileNav(); }
        else { mobileNav.hidden = false; requestAnimationFrame(function(){ mobileNav.classList.add('open'); }); hamburger.setAttribute('aria-expanded','true'); }
      });
      mobileNav.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMobileNav); });
    }

    var navLinks = document.querySelectorAll('#mainNav a[href^="#"]');
    window.addEventListener('resume:rendered', function(){
      var navSections = Array.prototype.slice.call(navLinks).map(function(a){ return document.querySelector(a.getAttribute('href')); }).filter(Boolean);
      if(navSections.length && 'IntersectionObserver' in window){
        var navIo = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              var id = '#' + entry.target.id;
              navLinks.forEach(function(a){ a.classList.toggle('current', a.getAttribute('href') === id); });
            }
          });
        }, { rootMargin: '-40% 0px -55% 0px' });
        navSections.forEach(function(s){ navIo.observe(s); });
      }
    });
  })();
</script>
</body>
</html>
