<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vignesh J — Resume</title>
<meta name="description" content="Resume of Vignesh J, Software Engineer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="resume.css">
<script>
  document.documentElement.setAttribute('data-theme','light');
</script>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <a class="brand" href="../" aria-label="Back to portfolio">Vignesh<span class="blink">_</span></a>
    <div class="right">
      <nav aria-label="Section navigation" id="mainNav">
        <a href="#experience">experience</a>
        <a href="#projects">projects</a>
        <a href="#skills">skills</a>
        <a href="#education">education</a>
      </nav>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light theme">
        <svg class="icon-sun" aria-hidden="true"><use href="../icons/icons.svg#sun"></use></svg>
        <svg class="icon-moon" aria-hidden="true"><use href="../icons/icons.svg#moon"></use></svg>
      </button>
      <button class="icon-btn hamburger" id="hamburgerBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav">
        <svg aria-hidden="true"><use href="../icons/icons.svg#menu"></use></svg>
      </button>
    </div>
  </div>
  <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation" hidden>
    <a href="#experience">experience</a>
    <a href="#projects">projects</a>
    <a href="#skills">skills</a>
    <a href="#education">education</a>
  </nav>
</div>

<div class="page-actions no-print">
  <a class="btn" href="../">← Back to portfolio</a>
  <div class="page-actions-right">
    <button class="btn" id="shareBtn" type="button">
      <svg class="btn-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.5 10.5 15.5 6.5"/><path d="M8.5 13.5 15.5 17.5"/></svg>
      <span class="btn-label">Share</span>
    </button>
    <button class="btn primary" id="downloadBtn" type="button">
      <svg class="btn-icon" aria-hidden="true"><use href="../icons/icons.svg#download"></use></svg>
      <span class="btn-label">Download / Print</span>
    </button>
  </div>
</div>

<main class="resume-page" id="resumePage">
  <div class="loading" id="loading">Loading resume…</div>
</main>

<script src="resume.js"></script>
<script>
  (function(){
    var themeBtn = document.getElementById('themeToggle');
    var hamburger = document.getElementById('hamburgerBtn');
    var mobileNav = document.getElementById('mobileNav');

    var currentTheme = document.documentElement.getAttribute('data-theme');
    themeBtn.setAttribute('aria-label', currentTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');

    themeBtn.addEventListener('click', function(){
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      themeBtn.setAttribute('aria-label', next === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    });

    function closeMobileNav(){
      mobileNav.classList.remove('open');
      mobileNav.hidden = true;
      hamburger.setAttribute('aria-expanded','false');
    }
    if(hamburger){
      hamburger.addEventListener('click', function(){
        var isOpen = mobileNav.classList.contains('open');
        if(isOpen){ closeMobileNav(); }
        else { mobileNav.hidden = false; requestAnimationFrame(function(){ mobileNav.classList.add('open'); }); hamburger.setAttribute('aria-expanded','true'); }
      });
      mobileNav.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMobileNav); });
    }

    var navLinks = document.querySelectorAll('#mainNav a[href^="#"]');
    var navSections = Array.prototype.slice.call(navLinks).map(function(a){ return document.querySelector(a.getAttribute('href')); }).filter(Boolean);
    if(navSections.length && 'IntersectionObserver' in window){
      var navIo = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            var id = '#' + entry.target.id;
            navLinks.forEach(function(a){ a.classList.toggle('current', a.getAttribute('href') === id); });
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' });
      navSections.forEach(function(s){ navIo.observe(s); });
    }
  })();
</script>
</body>
</html>
